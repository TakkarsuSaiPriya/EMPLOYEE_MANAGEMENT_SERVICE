spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employeedb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect

  activemq:
    broker-url: vm://embedded-broker
    in-memory: true
    packages:
      trust-all: true

server:
  port: 8081